name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install tmux build dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake bison libevent-dev libncurses-dev pkg-config
      - name: Build tmux 3.7b
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/tmux/tmux/archive/refs/tags/3.7b.tar.gz \
            --output /tmp/tmux-3.7b.tar.gz
          echo "156dc43dcbc7f06e35e1fae3118c44d77a370c46676b34b82bbafc4e608d8130  /tmp/tmux-3.7b.tar.gz" \
            | sha256sum --check
          tar -xzf /tmp/tmux-3.7b.tar.gz -C /tmp
          cd /tmp/tmux-3.7b
          sh autogen.sh
          ./configure
          make -j2
          sudo make install
      - name: Verify supported tmux version
        run: |
          tmux_version="$(tmux -V | awk '{print $2}')"
          tmux_major="${tmux_version%%.*}"
          tmux_minor="${tmux_version#*.}"
          tmux_minor="${tmux_minor%%[!0-9]*}"
          test "$tmux_major" -gt 3 || {
            test "$tmux_major" -eq 3 && test "$tmux_minor" -ge 7
          }
          tmux -V
      - name: Test with the minimum supported tmux
        run: cargo test --locked --all-targets
      - name: Match tag to Cargo package version
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v${cargo_version}"
          grep --fixed-strings "## [${cargo_version}]" CHANGELOG.md

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package release archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive="tmux-recover-${TARGET}"
          mkdir -p "dist/${archive}"
          cp "target/${TARGET}/release/tmux-recover" "dist/${archive}/"
          cp -R completions "dist/${archive}/"
          cp README.md LICENSE "dist/${archive}/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          cd dist
          shasum -a 256 "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: tmux-recover-${{ matrix.target }}
          path: |
            dist/tmux-recover-${{ matrix.target }}.tar.gz
            dist/tmux-recover-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tmux-recover-*
          path: release-assets
          merge-multiple: true
      - name: Create aggregate checksum file
        run: cat release-assets/*.sha256 > release-assets/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            --verify-tag
