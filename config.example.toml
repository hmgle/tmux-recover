[autosave]
debounce = 5
min_interval = 30
poll_interval = 60
# How often process-current.json may be rewritten while the layout is
# unchanged. Only used when restore.process_allowlist is non-empty and by
# --restore-processes; it overwrites one file in place rather than adding to
# snapshot history. Set restore.process_allowlist = [] to disable Linux /proc
# collection and remove the live process sidecar.
process_checkpoint_interval = 300
# Persistent indexed tmux hook slot. Installation is atomic and set-only: an
# identical tmux-recover hook is reused, while every other command is preserved
# and makes the daemon warn and fall back to polling. Legacy client-specific
# tmux-recover hooks still make startup fail and are reported for explicit
# removal after the old daemon is stopped; they are never removed automatically.
# Choose a slot dedicated to tmux-recover for event-driven saves.
hook_slot = 901

[retention]
recent = 100
hourly_days = 30
daily_days = 180
# Keep this many pre-restore safety snapshots. User-pinned snapshots are
# separate and remain exempt from pruning until explicitly unpinned.
safety_snapshots = 10

[restore]
auto = false
auto_bootstrap_max_age_seconds = 30
process_allowlist = [
  "vi", "vim", "view", "nvim", "emacs", "man", "less", "more",
  "tail", "top", "htop", "irssi", "weechat", "mutt",
]

[storage]
zstd = false
