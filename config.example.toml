[autosave]
debounce = 5
min_interval = 30
poll_interval = 60

[retention]
recent = 100
hourly_days = 30
daily_days = 180

[restore]
auto = false
auto_bootstrap_max_age_seconds = 30
process_allowlist = [
  "vi", "vim", "view", "nvim", "emacs", "man", "less", "more",
  "tail", "top", "htop", "irssi", "weechat", "mutt",
]

[storage]
zstd = false
