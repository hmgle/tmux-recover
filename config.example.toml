[autosave]
debounce = 5
min_interval = 30
poll_interval = 60
# How often process-current.json may be rewritten while the layout is
# unchanged. Only used by --restore-processes; it overwrites one file in place
# rather than adding to snapshot history.
process_checkpoint_interval = 300

[retention]
recent = 100
hourly_days = 30
daily_days = 180

[restore]
auto = false
auto_bootstrap_max_age_seconds = 30
process_allowlist = [
  "vi", "vim", "view", "nvim", "emacs", "man", "less", "more",
  "tail", "top", "htop", "irssi", "weechat", "mutt",
]

[storage]
zstd = false
