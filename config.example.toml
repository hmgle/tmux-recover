[autosave]
debounce = 5
min_interval = 30
poll_interval = 60
# How often process-current.json may be rewritten while the layout is
# unchanged. Only used by --restore-processes; it overwrites one file in place
# rather than adding to snapshot history.
process_checkpoint_interval = 300
# Indexed tmux hook slot. The daemon refuses to overwrite another command in
# this slot; choose a different value if another plugin already uses it.
hook_slot = 901

[retention]
recent = 100
hourly_days = 30
daily_days = 180
# Keep this many pre-restore safety snapshots. User-pinned snapshots are
# separate and remain exempt from pruning until explicitly unpinned.
safety_snapshots = 10

[restore]
auto = false
auto_bootstrap_max_age_seconds = 30
process_allowlist = [
  "vi", "vim", "view", "nvim", "emacs", "man", "less", "more",
  "tail", "top", "htop", "irssi", "weechat", "mutt",
]

[storage]
zstd = false
